<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adio — AI Voice Studio</title>
    <meta
      name="description"
      content="Find the perfect voice for your Text to Speech needs. Simply describe the voice you are looking for and synthesize expressive, human-like speech with Gemini TTS."
    />
    <meta property="og:title" content="Adio — AI Voice Studio" />
    <meta
      property="og:description"
      content="Multi-voice Text-to-Speech Studio powered by Gemini 3.8 TTS with 100+ expressive human-like voices, dual-speaker dialogue, and multilingual synthesis."
    />
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              studio: {
                bg: '#F8F9FA',
                surface: '#FFFFFF',
                darkBg: '#131314',
                darkSurface: '#1E1F20',
                darkElevated: '#28292A',
                blue: '#1A73E8',
                blueDark: '#8AB4F8',
                red: '#EA4335',
                yellow: '#FBBC04',
                green: '#34A853'
              }
            },
            fontFamily: {
              display: ['Plus Jakarta Sans', 'sans-serif'],
              sans: ['DM Sans', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            animation: {
              'fade-in': 'fadeIn 0.25s ease-out',
              'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
              'google-bar': 'googleBar 2.4s linear infinite'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' }
              },
              slideUp: {
                '0%': { transform: 'translateY(12px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' }
              },
              googleBar: {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '200% 50%' }
              }
            }
          }
        }
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-[#F8F9FA] dark:bg-[#131314] text-[#1F1F1F] dark:text-[#E3E3E3] antialiased selection:bg-blue-100 dark:selection:bg-blue-900/40">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
